name: Pages

# Runs the tests, builds every page (home, roadmap, coverage map, devlog) and, on main, deploys
# docs/ to GitHub Pages. The HTML is not committed: it is built here, so it always matches the
# sources. Pages must use "GitHub Actions" as its source (Settings > Pages).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # once a week, so a link to another site that broke is caught even when nothing here changed
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history: a page's version is the commits that changed it

      - name: No committed HTML
        run: |
          html=$(git ls-files '*.html')
          if [ -n "$html" ]; then
            for f in $html; do echo "::error file=$f::generated page committed: CI builds it, remove it with git rm --cached $f"; done
            exit 1
          fi

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Node runs the oracle: the pinned Pele npm package (reference/PIN)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # the same setup as a laptop or a coding-agent sandbox: PCRE for nimib's markdown, the
      # docs' dependencies at the commits of deps.lock, and the pinned Pele (source and package)
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ hashFiles('deps.lock') }}
      - uses: actions/cache@v4
        with:
          path: |
            reference/pele
            reference/npm
          key: pele-${{ hashFiles('reference/PIN') }}
      - run: sh tools/setup.sh

      - uses: actions/cache@v4
        with:
          path: ~/.cache/nim
          key: nimcache-2.2.4-${{ hashFiles('src/**/*.nim', 'docs/**/*.nim', 'tests/**/*.nim', 'tools/*.nim', '*.nims', 'nim.cfg', 'deps.lock') }}
          restore-keys: nimcache-2.2.4-

      # every `port-of:` header names a file of Pele at the pin
      - name: Port map
        run: nim r tools/portmap.nim check

      # The referee. The corpus is rebuilt from the pinned Pele and must match the committed one;
      # the self test proves difftest can fail; then every case is compared, and a type the
      # coverage map marks done must be identical on every case.
      - name: Corpus matches the pin
        run: |
          node tools/corpus.mjs
          git diff --exit-code --stat corpus/ || { echo "::error::corpus/cases.json differs from what tools/corpus.mjs builds: rerun it and commit"; exit 1; }

      - name: Difftest self test
        run: nim r tools/difftest.nim --self-test

      - name: Difftest
        run: nim r tools/difftest.nim --check-done --show:30

      # Differential fuzzing: inputs generated from each ported type's grammar, against Pele
      - name: Fuzz
        run: |
          nim r tools/fuzz.nim pie --cases:5000
          nim r tools/fuzz.nim timeline --cases:5000
          nim r tools/fuzz.nim flowchart --cases:5000
          nim r tools/fuzz.nim state --cases:5000
          nim r tools/fuzz.nim journey --cases:5000
          nim r tools/fuzz.nim info --cases:1000
          nim r tools/fuzz.nim packet --cases:5000

      - name: Tests
        run: |
          if [ -f tests/all.nim ]; then nim r tests/all.nim; else echo "no tests/all.nim yet"; fi

      # compiled and run as two steps, so the timings show which of the two is slow
      - name: Compile the pages
        run: nim c -d:nimibQuiet docs/all.nim

      - name: Build the pages
        run: docs/all

      # Every link of the pages leads to a page (and its #anchor) of the site, or to a file of
      # this repository. Links to other sites (no 404 or 410) are checked only once a week and by
      # hand: they break without a change here, and they slow every run.
      - name: Links
        run: nim r -d:ssl tools/links.nim ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--external' || '' }}

      - name: No HTML, styles or colours in the pages
        run: nim r tools/drift.nim --fail --allow:docs/theme.nim --allow:docs/blocks.nim --allow:docs/review.nim docs/

      - name: Assemble site
        run: |
          mkdir _site
          (cd docs && find . -name '*.html' | tar -c -T - | tar -x -C ../_site)
          # the files every page shares: site.css (written by the build), the fonts, review.js
          cp -r docs/assets _site/assets
          # images and data that posts link to
          if [ -d docs/devlog/data ]; then (cd docs && find devlog/data -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.svg' -o -name '*.gif' -o -name '*.webp' \) | tar -c -T - | tar -x -C ../_site); fi
          touch _site/.nojekyll
          find _site -name '*.html' | sort
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
