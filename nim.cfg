# The dependencies, cloned by tools/setup.sh at the commits of deps.lock.
--noNimblePath
--path:"deps/nimib/src"
--path:"deps/tabelline/src"
--path:"deps/markdown/src"
--path:"deps/parsetoml/src"
--path:"deps/jsony/src"
--path:"deps/fusion/src"
# The renderer's one dependency (decision 0016): nitely's regex, and the Unicode tables it reads.
--path:"deps/regex/src"
--path:"deps/unicodedb/src"
# Strings hash with murmur and integers as themselves, in both builds: the default hashes
# (farmhash, Wang Yi) multiply 64-bit numbers, which JavaScript does by hand, some 25 times
# slower. A condition on the JavaScript backend is not seen here (Nim 2.2 reads this file before
# it knows the backend), and one hash for both builds keeps them alike (decision 0017).
define:nimStringHash2
define:nimIntHash1
